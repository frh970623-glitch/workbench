<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- iOS PWA standalone mode -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日工作台">
<meta name="mobile-web-app-capable" content="yes">

<!-- Theme -->
<meta name="theme-color" content="#4a7c59">

<!-- Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Icons (iOS requires PNG for standalone mode) -->
<link rel="apple-touch-icon" sizes="180x180" href="icon180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<title>每日工作台</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sidebar-w: 200px;
  --green: #4a7c59;
  --green-light: #5c8d6b;
  --green-bg: #e8f0e8;
  --bg: #f5f6f0;
  --card: #fff;
  --text: #2c2c2c;
  --text-light: #888;
  --border: #e0e0d8;
  --red: #d9534f;
  --shadow: 0 1px 4px rgba(0,0,0,0.06);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

/* ===== LAYOUT ===== */
.layout {
  display: flex;
  height: 100dvh;
}

/* ===== LEFT SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100dvh;
  background: #fff;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.25s ease;
}

.sidebar-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header .date {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 4px;
}

.sidebar-header .title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}

.sidebar-header .progress-text {
  font-size: 12px;
  color: var(--green);
  margin-top: 6px;
  font-weight: 500;
}

.progress-bar-wrap {
  margin-top: 8px;
  height: 4px;
  background: #e0e0d8;
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width 0.3s ease;
}

.cat-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.cat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  margin: 2px 8px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}

.cat-item:hover { background: #f5f6f0; }
.cat-item.active { background: var(--green); color: #fff; }

.cat-item .cat-emoji {
  font-size: 22px;
  width: 32px;
  text-align: center;
  flex-shrink: 0;
}

.cat-item .cat-info {
  flex: 1;
  min-width: 0;
}

.cat-item .cat-name {
  font-size: 14px;
  font-weight: 500;
}

.cat-item .cat-count {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 2px;
}

.cat-item .cat-badge {
  font-size: 11px;
  font-weight: 600;
  background: rgba(0,0,0,0.08);
  padding: 2px 8px;
  border-radius: 10px;
  flex-shrink: 0;
}

.cat-item.active .cat-badge {
  background: rgba(255,255,255,0.25);
}

.cat-item .cat-del {
  display: none;
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: #bbb;
  font-size: 16px;
  cursor: pointer;
  border-radius: 50%;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  line-height: 1;
  padding: 0;
  -webkit-appearance: none;
}

.cat-item:hover .cat-del { display: flex; }
.cat-item .cat-del:hover { color: var(--red); background: #fff0f0; }
.cat-item .cat-del:active { transform: scale(0.9); }

.cat-item.active .cat-del { color: rgba(255,255,255,0.7); }
.cat-item.active .cat-del:hover { color: #fff; background: rgba(255,255,255,0.2); }

/* sidebar footer */
.sidebar-footer {
  padding: 8px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.add-cat-row {
  display: flex;
  gap: 6px;
}

.add-cat-row input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  background: #fff;
  color: var(--text);
  outline: none;
  min-width: 0;
}

.add-cat-row input:focus { border-color: var(--green); }
.add-cat-row input::placeholder { color: #bbb; }

.add-cat-row button {
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  -webkit-appearance: none;
}

.add-cat-row button:hover { background: var(--green-light); }
.add-cat-row button:active { transform: scale(0.97); }

/* confirm dialog */
.dialog-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  align-items: center;
  justify-content: center;
}

.dialog-overlay.show { display: flex; }

.dialog {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  width: 280px;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}

.dialog .dialog-msg {
  font-size: 15px;
  margin-bottom: 20px;
  line-height: 1.5;
}

.dialog .dialog-btns {
  display: flex;
  gap: 10px;
}

.dialog .dialog-btns button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  -webkit-appearance: none;
}

.dialog .btn-cancel { background: #f0f0f0; color: #666; }
.dialog .btn-danger { background: var(--red); color: #fff; }

/* ===== RIGHT MAIN ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
  position: relative;
}

.main-header {
  padding: 20px 24px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: #fff;
}

/* hamburger */
.hamburger {
  display: none;
  width: 28px;
  height: 28px;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  padding: 2px;
  flex-shrink: 0;
}

.hamburger span {
  display: block;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: transform 0.2s, opacity 0.2s;
}

.main-header .cat-title {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.main-header .cat-emoji-lg { font-size: 24px; }

.main-header .cat-stats {
  font-size: 13px;
  color: var(--text-light);
}

/* ===== ADD TASK BAR ===== */
.add-bar {
  padding: 12px 24px;
  display: flex;
  gap: 10px;
  flex-shrink: 0;
  background: var(--bg);
}

.add-bar input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  background: #fff;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}

.add-bar input:focus { border-color: var(--green); }

.add-bar input::placeholder { color: #bbb; }

.add-bar button {
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
  -webkit-appearance: none;
}

.add-bar button:hover { background: var(--green-light); }
.add-bar button:active { transform: scale(0.97); }

/* ===== TASK LIST ===== */
.task-area {
  flex: 1;
  overflow-y: auto;
  padding: 8px 24px 40px;
  background: var(--bg);
  -webkit-overflow-scrolling: touch;
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 12px 0 8px;
}

.task-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border-radius: 12px;
  padding: 14px 14px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  transition: box-shadow 0.15s;
}

.task-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

.task-card.done { opacity: 0.55; }

/* checkbox */
.checkbox {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #ccc;
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}

.checkbox:hover { border-color: var(--green); }

.task-card.done .checkbox {
  background: var(--green);
  border-color: var(--green);
}

.checkbox svg {
  width: 12px;
  height: 12px;
  display: none;
}

.task-card.done .checkbox svg { display: block; }

.task-text {
  flex: 1;
  font-size: 15px;
  line-height: 1.4;
  word-break: break-word;
}

.task-card.done .task-text {
  text-decoration: line-through;
  color: var(--text-light);
}

.del-btn {
  width: 30px;
  height: 30px;
  border: none;
  background: transparent;
  color: #ccc;
  font-size: 16px;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: color 0.15s, background 0.15s;
  -webkit-appearance: none;
}

.del-btn:hover { color: var(--red); background: #fff0f0; }
.del-btn:active { transform: scale(0.92); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
  font-size: 14px;
}

/* ===== OVERLAY (mobile sidebar backdrop) ===== */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 99;
}

.overlay.show { display: block; }

/* ===== INSTALL BANNER ===== */
.install-banner {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--green);
  color: #fff;
  padding: 14px 20px;
  z-index: 200;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
}

.install-banner.show { display: flex; }

.install-banner button {
  background: #fff;
  color: var(--green);
  border: none;
  border-radius: 8px;
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  -webkit-appearance: none;
}

.install-banner .close-banner {
  background: transparent;
  color: #fff;
  font-size: 20px;
  padding: 4px 8px;
}

/* ===== RESPONSIVE ===== */

/* Tablet & Desktop: sidebar always visible */
@media (min-width: 769px) {
  .overlay { display: none !important; }
  .hamburger { display: none; }
}

/* Mobile: sidebar is a drawer */
@media (max-width: 768px) {
  :root { --sidebar-w: 180px; }

  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    transform: translateX(-100%);
  }

  .sidebar.open { transform: translateX(0); }

  .hamburger { display: flex; }

  .main-header { padding: 16px 16px; }

  .main-header .cat-title { font-size: 16px; }

  .add-bar { padding: 10px 16px; }

  .add-bar button { padding: 10px 16px; font-size: 13px; }

  .task-area { padding: 6px 16px 40px; }
}
</style>
</head>
<body>

<!-- Overlay for mobile -->
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="layout">
  <!-- ========== LEFT SIDEBAR ========== -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="date" id="headerDate"></div>
      <div class="title">每日工作台</div>
      <div class="progress-text" id="headerProgress"></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="headerProgressBar"></div>
      </div>
    </div>
    <div class="cat-list" id="catList"></div>
    <div class="sidebar-footer">
      <div class="add-cat-row">
        <input type="text" id="addCatInput" placeholder="新分类名称…" maxlength="20">
        <button onclick="addCategory()">+</button>
      </div>
    </div>
  </nav>

  <!-- ========== RIGHT CONTENT ========== -->
  <main class="main">
    <div class="main-header" id="mainHeader">
      <div class="hamburger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </div>
      <div class="cat-title">
        <span class="cat-emoji-lg" id="mainEmoji"></span>
        <span id="mainTitle"></span>
      </div>
      <span class="cat-stats" id="mainStats"></span>
    </div>

    <div class="add-bar">
      <input type="text" id="addInput" placeholder="添加新任务…" maxlength="100">
      <button onclick="addTask()">+ 添加</button>
    </div>

    <div class="task-area" id="taskArea"></div>
  </main>
</div>

<!-- Confirm delete dialog -->
<div class="dialog-overlay" id="confirmDialog">
  <div class="dialog">
    <div class="dialog-msg" id="dialogMsg"></div>
    <div class="dialog-btns">
      <button class="btn-cancel" onclick="closeDialog()">取消</button>
      <button class="btn-danger" id="dialogConfirmBtn">删除</button>
    </div>
  </div>
</div>

<!-- Install banner -->
<div class="install-banner" id="installBanner">
  <span>📲 添加到主屏幕，像 App 一样使用</span>
  <button onclick="installApp()">立即添加</button>
  <button class="close-banner" onclick="closeBanner()">&times;</button>
</div>

<script>
// ==================== DATA ====================
const DEFAULT_CATEGORIES = [
  { id: 'sport',   name: '运动健身', emoji: '💪', defaults: ['肩背训练', '臀腿训练', '腰腹训练'] },
  { id: 'study',   name: '学习',     emoji: '📚', defaults: ['阅读30分钟', '背单词50个'] },
  { id: 'work',    name: '工作',     emoji: '💼', defaults: ['回复邮件', '完成今日重点任务'] },
  { id: 'food',    name: '饮食',     emoji: '🍎', defaults: ['早餐', '午餐', '晚餐', '喝水8杯'] }
];

const TASK_STORAGE_KEY = 'workbench_tasks_v3';
const CAT_STORAGE_KEY = 'workbench_cats_v3';
let categories = [];
let activeCatId = '';
let taskData = {};

function loadCategories() {
  try {
    const raw = localStorage.getItem(CAT_STORAGE_KEY);
    if (raw) {
      categories = JSON.parse(raw);
      if (!categories.length) categories = [...DEFAULT_CATEGORIES];
    } else {
      categories = [...DEFAULT_CATEGORIES];
    }
  } catch (e) {
    categories = [...DEFAULT_CATEGORIES];
  }
}

function saveCategories() {
  localStorage.setItem(CAT_STORAGE_KEY, JSON.stringify(categories));
}

function loadData() {
  try {
    const raw = localStorage.getItem(TASK_STORAGE_KEY);
    if (raw) {
      taskData = JSON.parse(raw);
    }
  } catch (e) {}
  // ensure all current categories have task arrays
  categories.forEach(c => {
    if (!taskData[c.id]) taskData[c.id] = c.defaults.map(t => ({ text: t, done: false }));
  });
  // migrate old keys
  if (!taskData[categories[0]?.id] && Object.keys(taskData).length > 0) {
    // migrate from v2
    DEFAULT_CATEGORIES.forEach(c => {
      if (taskData[c.id]) return;
      const oldKey = c.id;
    });
  }
  if (!activeCatId || !categories.find(c => c.id === activeCatId)) {
    activeCatId = categories[0]?.id || '';
  }
  save();
}

function initDefaults() {
  categories = [...DEFAULT_CATEGORIES];
  taskData = {};
  categories.forEach(c => {
    taskData[c.id] = c.defaults.map(t => ({ text: t, done: false }));
  });
  activeCatId = categories[0].id;
  saveCategories();
  save();
}

function save() {
  localStorage.setItem(TASK_STORAGE_KEY, JSON.stringify(taskData));
}

// ==================== RENDER ====================
function getTasks(catId) {
  return taskData[catId] || [];
}

function catStats(catId) {
  const tasks = getTasks(catId);
  const done = tasks.filter(t => t.done).length;
  return { total: tasks.length, done };
}

function overallStats() {
  let total = 0, done = 0;
  categories.forEach(c => {
    const s = catStats(c.id);
    total += s.total;
    done += s.done;
  });
  return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
}

function renderSidebar() {
  const list = document.getElementById('catList');
  list.innerHTML = categories.map(c => {
    const s = catStats(c.id);
    const active = c.id === activeCatId ? ' active' : '';
    const remain = s.total - s.done;
    return `
      <div class="cat-item${active}" data-cat="${c.id}" onclick="selectCategory('${c.id}')">
        <span class="cat-emoji">${c.emoji}</span>
        <div class="cat-info">
          <div class="cat-name">${c.name}</div>
          <div class="cat-count">${remain > 0 ? remain + ' 项待办' : '全部完成'}</div>
        </div>
        <span class="cat-badge">${s.done}/${s.total}</span>
        <button class="cat-del" onclick="event.stopPropagation();confirmDeleteCat('${c.id}')" title="删除分类">&times;</button>
      </div>
    `;
  }).join('');

  // header stats
  const os = overallStats();
  document.getElementById('headerProgress').textContent = `完成 ${os.done}/${os.total}（${os.pct}%）`;
  document.getElementById('headerProgressBar').style.width = os.pct + '%';
}

function updateDateDisplay() {
  const now = new Date();
  const days = ['日','一','二','三','四','五','六'];
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 周${days[now.getDay()]} ${hh}:${mm}:${ss}`;
  document.getElementById('headerDate').textContent = dateStr;
}

// 以凌晨2点为界计算"任务日"：<2点算前一天
function getTaskDate() {
  const now = new Date();
  if (now.getHours() < 2) {
    const d = new Date(now);
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
}

function checkDailyReset() {
  const RESET_KEY = 'workbench_last_reset_date';
  const currentTaskDate = getTaskDate();
  const lastReset = localStorage.getItem(RESET_KEY) || '';
  if (currentTaskDate > lastReset) {
    // 新的一天：把所有任务重置为未完成
    Object.keys(taskData).forEach(catId => {
      taskData[catId].forEach(t => { t.done = false; });
    });
    save();
    localStorage.setItem(RESET_KEY, currentTaskDate);
    renderAll();
  } else if (!lastReset) {
    localStorage.setItem(RESET_KEY, currentTaskDate);
  }
  // 如果还没到2点但 lastReset 是空（首次），也写入
  if (!localStorage.getItem(RESET_KEY)) {
    localStorage.setItem(RESET_KEY, currentTaskDate);
  }
}

function renderMain() {
  const cat = categories.find(c => c.id === activeCatId);
  if (!cat) { activeCatId = categories[0]?.id || ''; return renderMain(); }

  document.getElementById('mainEmoji').textContent = cat.emoji;
  document.getElementById('mainTitle').textContent = cat.name;

  const s = catStats(activeCatId);
  document.getElementById('mainStats').textContent = `${s.done}/${s.total} 已完成`;

  const tasks = getTasks(activeCatId);
  const pending = tasks.filter(t => !t.done);
  const completed = tasks.filter(t => t.done);

  const area = document.getElementById('taskArea');

  if (tasks.length === 0) {
    area.innerHTML = '<div class="empty-state">还没有任务，在上方添加一个吧</div>';
    return;
  }

  let html = '';

  if (pending.length > 0) {
    html += '<div class="section-label">待办（' + pending.length + '）</div>';
    pending.forEach((t, i) => {
      const idx = tasks.indexOf(t);
      html += taskCardHTML(idx, t, false);
    });
  }

  if (completed.length > 0) {
    html += '<div class="section-label">已完成（' + completed.length + '）</div>';
    completed.forEach((t, i) => {
      const idx = tasks.indexOf(t);
      html += taskCardHTML(idx, t, true);
    });
  }

  area.innerHTML = html;
  document.getElementById('addInput').value = '';
}

function taskCardHTML(index, task, done) {
  const cls = done ? ' task-card done' : ' task-card';
  const text = escapeHTML(task.text);
  return `
    <div class="${cls}">
      <div class="checkbox" onclick="toggleTask(${index})">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <span class="task-text">${text}</span>
      <button class="del-btn" onclick="deleteTask(${index})" title="删除">🗑</button>
    </div>
  `;
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectCategory(catId) {
  activeCatId = catId;
  closeSidebar();
  renderAll();
}

function renderAll() {
  renderSidebar();
  renderMain();
}

// ==================== ACTIONS ====================
function toggleTask(index) {
  const tasks = getTasks(activeCatId);
  if (index < 0 || index >= tasks.length) return;
  tasks[index].done = !tasks[index].done;
  save();
  renderAll();
}

function deleteTask(index) {
  const tasks = getTasks(activeCatId);
  if (index < 0 || index >= tasks.length) return;
  tasks.splice(index, 1);
  save();
  renderAll();
}

function addTask() {
  const input = document.getElementById('addInput');
  const text = input.value.trim();
  if (!text) return;
  taskData[activeCatId].push({ text, done: false });
  save();
  renderAll();
}

document.getElementById('addInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addTask();
});

// ==================== CATEGORY MANAGEMENT ====================
let pendingDeleteCatId = null;

function addCategory() {
  const input = document.getElementById('addCatInput');
  const name = input.value.trim();
  if (!name) return;
  // generate unique id
  let id = 'cat_' + Date.now();
  // default emoji
  categories.push({ id, name, emoji: '📌', defaults: [] });
  taskData[id] = [];
  saveCategories();
  save();
  input.value = '';
  activeCatId = id;
  renderAll();
}

document.getElementById('addCatInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addCategory();
});

function confirmDeleteCat(catId) {
  if (categories.length <= 1) {
    alert('至少保留一个分类');
    return;
  }
  const cat = categories.find(c => c.id === catId);
  if (!cat) return;
  pendingDeleteCatId = catId;
  document.getElementById('dialogMsg').textContent = '确定要删除「' + cat.name + '」分类及其所有任务吗？';
  document.getElementById('confirmDialog').classList.add('show');
}

function closeDialog() {
  document.getElementById('confirmDialog').classList.remove('show');
  pendingDeleteCatId = null;
}

document.getElementById('dialogConfirmBtn').addEventListener('click', function() {
  if (!pendingDeleteCatId) return;
  deleteCategory(pendingDeleteCatId);
  closeDialog();
});

function deleteCategory(catId) {
  categories = categories.filter(c => c.id !== catId);
  delete taskData[catId];
  saveCategories();
  save();
  if (activeCatId === catId) {
    activeCatId = categories[0]?.id || '';
  }
  renderAll();
}

// ==================== SIDEBAR MOBILE ====================
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const open = sidebar.classList.toggle('open');
  overlay.classList.toggle('show', open);
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ==================== PWA INSTALL ====================
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result) {
      document.getElementById('installBanner').classList.remove('show');
      deferredPrompt = null;
    });
  } else {
    // iOS fallback
    alert('请点击浏览器底部的「分享」按钮，然后选择「添加到主屏幕」');
  }
}

function closeBanner() {
  document.getElementById('installBanner').classList.remove('show');
}

// Service Worker — register with explicit scope for PWA standalone
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register(location.origin + '/sw.js', { scope: location.origin + '/' }).catch(function(){});
}

// ==================== INIT ====================
loadCategories();
loadData();
if (!taskData || !Object.keys(taskData).length) initDefaults();
checkDailyReset();
updateDateDisplay();
renderAll();

// Standalone detection for debugging
(function checkStandalone() {
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!isStandalone && window.location.hostname !== 'localhost' && !window.location.hostname.startsWith('192.')) {
    // Not in standalone mode — show a subtle note
    console.log('PWA: running in browser mode. Add to Home Screen for standalone app experience.');
  }
})();

// 日期每秒刷新
setInterval(updateDateDisplay, 1000);
// 每60秒检查一次是否跨过凌晨2点
setInterval(function() {
  checkDailyReset();
  updateDateDisplay();
}, 60000);

// Close sidebar on escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSidebar();
});
</script>
</body>
</html>
